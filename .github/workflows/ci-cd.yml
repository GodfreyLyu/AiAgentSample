name: Test, publish, and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: ai-agent-sample
  EKS_CLUSTER_NAME: eks-workshop
  KUBERNETES_NAMESPACE: ai-agent-sample
  TARGET_GROUP_NAME: ai-agent-sample-dev-tg

jobs:
  quality:
    name: Test and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install application and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Verify the container image builds
        if: github.event_name == 'pull_request'
        run: docker build --platform linux/amd64 --tag ai-agent-sample:ci .

  build-and-push-ecr:
    name: Build and push an image to ECR
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.uri }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v7

      - name: Validate AWS publishing configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo "::error::Set the AWS_DEPLOY_ROLE_ARN repository variable to the Terraform github_actions_deploy_role_arn output."
            exit 1
          fi
      - name: Show actual OIDC claims
        shell: bash
        env:
          EXPECTED_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          echo "Role requested by workflow: ${EXPECTED_ROLE_ARN}"

          response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          token="$(jq -r '.value' <<<"${response}")"

          OIDC_TOKEN="${token}" python3 - <<'PY'
          import base64
          import json
          import os

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          safe_claims = {
              key: claims.get(key)
              for key in (
                  "iss",
                  "aud",
                  "sub",
                  "repository",
                  "repository_id",
                  "repository_owner",
                  "repository_owner_id",
                  "ref",
                  "environment",
                  "job_workflow_ref",
              )
          }

          print(json.dumps(safe_claims, indent=2))
          PY
      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create an immutable image reference
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "uri=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.uri }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image details
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### ECR image"
            echo
            echo "- URI: \`${IMAGE_URI}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy the published image to EKS
    needs: build-and-push-ecr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 1

      - uses: azure/setup-kubectl@v5
        with:
          version: v1.35.0

      - name: Configure Kubernetes access
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Verify Kubernetes deployment permissions
        run: |
          set -euo pipefail

          require_permission() {
            local verb="$1"
            local resource="$2"
            if ! kubectl auth can-i "$verb" "$resource" \
              --namespace "$KUBERNETES_NAMESPACE" \
              --quiet; then
              echo "::error::GitHub Actions cannot ${verb} ${resource} in namespace ${KUBERNETES_NAMESPACE}. Apply the Terraform GitHub Actions RBAC configuration first."
              exit 1
            fi
          }

          for resource in \
            configmaps \
            services \
            deployments.apps \
            externalsecrets.external-secrets.io \
            secretstores.external-secrets.io \
            targetgroupbindings.elbv2.k8s.aws; do
            require_permission get "$resource"
            require_permission create "$resource"
            require_permission patch "$resource"
          done
          require_permission watch externalsecrets.external-secrets.io
          require_permission watch deployments.apps

      - name: Deploy and verify rollout
        env:
          IMAGE: ${{ needs.build-and-push-ecr.outputs.image }}
        run: |
          IMAGE_NAME="${IMAGE%:*}"
          IMAGE_TAG="${IMAGE##*:}"
          sed -i "s|newName: .*|newName: ${IMAGE_NAME}|" deploy/overlays/eks/kustomization.yaml
          sed -i "s|newTag: .*|newTag: ${IMAGE_TAG}|" deploy/overlays/eks/kustomization.yaml
          kubectl apply -k deploy/overlays/eks
          kubectl wait externalsecret/ai-agent-sample-secrets \
            --for=condition=Ready \
            --timeout=120s \
            --namespace "$KUBERNETES_NAMESPACE"
          kubectl rollout status deployment/ai-agent-sample \
            --timeout=300s \
            --namespace "$KUBERNETES_NAMESPACE"
          kubectl get targetgroupbinding ai-agent-sample \
            --namespace "$KUBERNETES_NAMESPACE"

          TARGET_GROUP_ARN="$(aws elbv2 describe-target-groups \
            --names "$TARGET_GROUP_NAME" \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text)"
          aws elbv2 wait target-in-service \
            --target-group-arn "$TARGET_GROUP_ARN"
