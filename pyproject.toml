[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-sample"
version = "0.1.0"
description = "A production-oriented FastAPI service for a Pydantic AI coding agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "logfire>=4,<5",
    "pydantic-ai-slim[openai]>=2.22,<3",
    "pydantic-settings>=2.15,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

